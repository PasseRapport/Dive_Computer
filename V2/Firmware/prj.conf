# Enable MPU
CONFIG_ARM_MPU=y

# GPIO driver (rail enables, interrupts, screen control)
CONFIG_GPIO=y

# No UART is routed on this board: use SEGGER RTT over SWD for console
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Preserve OSTC4 binary32/binary64 source precision; Cortex-M4F is single only.
CONFIG_FPU=y
CONFIG_PICOLIBC=y
# Reserved stacks; static reservations are not runtime high-water measurements.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
# Honor the board's image-0 partition (0xc000..0x43000, 220 KiB).
CONFIG_USE_DT_CODE_PARTITION=y
# This development application and the calculation path use no allocation.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
