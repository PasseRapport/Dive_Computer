<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <rect width="44" height="44" fill="#000"/>
  <!-- Bezel -->
  <circle cx="22" cy="22" r="19" fill="none" stroke="#fff" stroke-width="2.4"/>
  <!-- North pointer triangle -->
  <polygon points="18.2,5 25.8,5 22,9.5" fill="#fff"/>
  <!-- Cardinal ticks -->
  <line x1="22" y1="38.6" x2="22" y2="35.4" stroke="#fff" stroke-width="1.8"/>
  <line x1="38.6" y1="22" x2="35.4" y2="22" stroke="#fff" stroke-width="1.8"/>
  <line x1="5.4" y1="22" x2="8.6" y2="22" stroke="#fff" stroke-width="1.8"/>
  <!-- Tilted Needle (35 deg) -->
  <g transform="rotate(35 22 22)">
    <polygon points="22,8.5 17.5,22 26.5,22" fill="#fff"/>
    <polygon points="22,35.5 17.5,22 26.5,22" fill="none" stroke="#fff" stroke-width="1.8"/>
    <circle cx="22" cy="22" r="2.8" fill="#000"/>
    <circle cx="22" cy="22" r="1.2" fill="#fff"/>
  </g>
</svg>