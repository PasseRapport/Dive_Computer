name: Android companion
on:
  push:
    paths: ['app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 -m unittest discover -s simulator -v
      - run: ./gradlew :core:test :android:testDebugUnitTest :android:assembleDebug :android:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dive-watch-debug-and-reports
          path: |
            app/android/build/outputs/apk/debug/*.apk
            app/android/build/reports/
            app/core/build/reports/tests/
